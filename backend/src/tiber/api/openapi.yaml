openapi: 3.1.0

info:
  title: Tiber API
  version: 1.0.0
  summary: Tiber API v1
  license:
    name: MIT
    url: https://opensource.org/license/mit
  description: |
    Intelligent production-grade notification platform.

    ## Authentication

    All protected endpoints require `Authorization: Bearer <token>`.
    They support two authentication mechanisms:

    - **API Keys** (`tb_xxxxx`): for client applications submitting notifications.
      Generated and scoped per project. Revocation is immediate.
    - **JWT access tokens**: for dashboard users and administrators.
      Short-lived (15 minutes by default). Refreshed via `/v1/auth/refresh`.

    The server verifies the token signature first. The Redis blocklist
    is checked only after a valid signature is confirmed. If Redis is
    unreachable, all authenticated requests fail with 503.

    Rate limits use separate counters: unauthenticated auth endpoints are
    keyed by client IP, account-level dashboard requests by account ID, and
    project routes by project ID regardless of authentication method.
    Forwarded-IP headers are not trusted.

    ## Errors

    All errors follow a consistent format:

    ```json
    {
      "error": "not_found",
      "message": "Notification abc123 not found",
      "status": 404,
      "correlation_id": "a1b2..."
    }
    ```

    ## Pagination

    List endpoints use cursor-based pagination:

    ```json
    {
      "data": [...],
      "next_cursor": "eyJjcmVhdGVkX2F0IjoiLi4uIn0"
    }
    ```

    Pass `next_cursor` back as the `cursor` query parameter to fetch the next
    page. A `null` cursor means the list is exhausted.

    Cursors are opaque and scoped to the listing that produced them.

    ## Idempotency

    `POST /v1/projects/{project_id}/notifications` requires an
    `Idempotency-Key` header. Replaying a key with the same body returns the
    original `202` and the same `transaction_id`; reusing it with a different
    body is rejected with `409`.

servers:
  - url: http://api.tiber.local:8000
    description: Local development
  - url: https://api.tiber.dev
    description: Production

security:
  - BearerAuth: []

tags:
  - name: Auth
    description: Authentication and token management
  - name: Projects
    description: Project management, the primary tenancy boundary
  - name: API Keys
    description: Project-scoped machine authentication keys
  - name: Templates
    description: Reusable notification content templates
  - name: Recipients
    description: Notification recipients and channel addresses
  - name: Delivery Constraints
    description: Project-level blackout periods and quiet-hours windows
  - name: Topics
    description: Notification topics that classify and route sends
  - name: Notifications
    description: Notification intake, status, and delivery history
  - name: Webhooks
    description: Outbound event callback endpoint registration
  - name: Delivery Attempts
    description: Notification delivery attempt history and provider responses
  - name: Engagement Events
    description: Recipient engagement events (opens, clicks, etc.)
  - name: Observability
    description: Health checks and metrics

paths:
  # Auth

  /v1/auth/register:
    post:
      tags: [Auth]
      summary: Create a new account
      operationId: postv1authregister
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "202":
          description: Account created; a verification email was queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationAccepted"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
      description: |
        Creates an unverified email/password account and sends a verification
        message. No session is issued until the email is verified.

  /v1/auth/login:
    post:
      tags: [Auth]
      summary: Authenticate and obtain tokens
      operationId: postv1authlogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Email address not verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: email_not_verified
                message: Please verify your email address before signing in
                status: 403
                correlation_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
      description: |
        Authenticates a dashboard user.
        Returns a short-lived access token and a refresh token.

  /v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh an access token
      operationId: postv1authrefresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
      description: |
        Accepts a refresh token and returns a new access and refresh token.
        The refresh token is rotated on each use. If the refresh
        token is revoked or expired, the request fails with 401.

  /v1/auth/logout:
    post:
      tags: [Auth]
      summary: Logout the current account
      operationId: postv1authlogout
      description: |
        Revokes the current access token and refresh token immediately.
        Subsequent requests using either token are rejected
        even before the token's natural expiry.
      responses:
        "204":
          description: Token revoked
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/auth/me:
    get:
      tags: [Auth]
      summary: Get the current account
      operationId: getv1authme
      description: |
        Returns the profile of the currently authenticated dashboard user.
      responses:
        "200":
          description: Current authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"

    patch:
      tags: [Auth]
      summary: Update the current account
      operationId: patchv1authme
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: Account profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
      description: |
        Updates the authenticated user's email address.
        Returns 409 if the new email is already registered.

    delete:
      tags: [Auth]
      summary: Delete the current account
      operationId: deletev1authme
      responses:
        "204":
          description: Account deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
      description: |
        Deactivates the authenticated account, revokes its API keys, and
        preserves project-owned operational history and ownership records.

  /v1/auth/email/verify:
    post:
      tags: [Auth]
      summary: Verify email address
      operationId: postv1authemailverify
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailVerifyRequest"
      responses:
        "200":
          description: Email verified successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
      description: |
        Accepts the six-digit verification code sent to the user's email
        after registration or after an email change via PATCH /v1/auth/me.
        Sets the account as verified and returns a full access token
        and refresh token. This is the first authenticated session for
        email/password registered users. Codes expire after 10 minutes.
        Verification is temporarily locked after five incorrect attempts,
        including across code resends.
        Returns 401 if the code is invalid, expired, or locked. Use
        /v1/auth/email/verify/resend to request a new code.

  /v1/auth/email/verify/resend:
    post:
      tags: [Auth]
      summary: Resend verification email
      operationId: postv1authemailverifyresend
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailVerifyResendRequest"
      responses:
        "202":
          description: Verification email accepted for delivery
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
      description: |
        Resends the verification email to the provided address.
        Useful if the original code expired or the email was lost.
        Always returns 202 regardless of whether the email is registered
        or already verified — this prevents account enumeration.
        Codes from previous resend requests are invalidated.

  /v1/auth/github:
    get:
      tags: [Auth]
      summary: Initiate GitHub OAuth sign-in
      operationId: getv1authgithub
      security: []
      responses:
        "204":
          description: Token revoked
        "302":
          description: Redirects the user to GitHub for authorisation
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          description: GitHub OAuth is unavailable or misconfigured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: oauth_unavailable
                message: GitHub OAuth is currently unavailable
                status: 503
                correlation_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
      description: |
        Redirects the user to GitHub's OAuth authorisation page.
        After the user grants access, GitHub redirects back to
        /v1/auth/github/callback with an authorisation code.

  /v1/auth/github/callback:
    get:
      tags: [Auth]
      summary: GitHub OAuth callback
      operationId: getv1authgithubcallback
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
          description: Authorisation code returned by GitHub.
        - name: state
          in: query
          required: true
          schema:
            type: string
          description: CSRF state token for request verification.
      responses:
        "200":
          description: GitHub authentication successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
      description: |
        Requires the one-time CSRF state returned by /v1/auth/github.
        Exchanges the GitHub authorisation code for a Tiber access token
        and refresh token. Creates a new account if no account exists for
        the GitHub identity. Returns the same TokenResponse as /v1/auth/login.

  /v1/auth/password/change:
    post:
      tags: [Auth]
      summary: Change password
      operationId: postv1authpasswordchange
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChangeRequest"
      responses:
        "204":
          description: Password changed successfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
      description: |
        Changes the password for the currently authenticated user.
        Requires the current password as confirmation.
        Returns 400 with error no_password_set if the account
        was created via GitHub OAuth and has no password.

  /v1/auth/password/reset-request:
    post:
      tags: [Auth]
      summary: Request a password reset
      operationId: postv1authpasswordresetrequest
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "202":
          description: Reset request accepted
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
      description: |
        Accepts an email address and sends a password reset link
        if an account with that address exists. Always returns 202
        regardless of whether the email is registered.

  /v1/auth/password/reset:
    post:
      tags: [Auth]
      summary: Reset password using a reset token
      operationId: postv1authpasswordreset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirm"
      responses:
        "204":
          description: Password reset successful
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
      description: |
        Accepts the reset token from the email link and a new password.
        Invalidates the reset token on use. Returns 401 if the token
        is invalid or expired.

  # Projects

  /v1/projects:
    post:
      tags: [Projects]
      summary: Create a project
      operationId: postv1projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
      description: |
        Creates a new project within the authenticated user's account.

    get:
      tags: [Projects]
      summary: List projects
      operationId: getv1projects
      description: |
        Returns all projects within the authenticated user's account.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/projects/{project_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"

    get:
      tags: [Projects]
      summary: Get a project
      operationId: getv1projectsprojectid
      responses:
        "200":
          description: Project found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags: [Projects]
      summary: Update a project
      operationId: patchv1projectsprojectid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: Project updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

    delete:
      tags: [Projects]
      summary: Delete a project
      operationId: deletev1projectsprojectid
      description: |
        Soft-deletes the project and prevents new notifications from being accepted.
        Existing delivery history, engagement events, and audit records are retained.

        The project can be restored at any point during its 90-day grace period.
        After that period, Tiber permanently deletes the project and its owned
        operational data automatically. There is no API-triggered hard delete.
      responses:
        "204":
          description: Project soft-deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/projects/{project_id}/restore:
    parameters:
      - $ref: "#/components/parameters/ProjectId"

    post:
      tags: [Projects]
      summary: Restore a deleted project
      operationId: postv1projectsprojectidrestore
      description: |
        Clears the project's deletion timestamp during its 90-day grace period.
        Restoring an active project is a no-op. Once the scheduled purge has
        removed the project, this returns `404`.
      responses:
        "200":
          description: Project restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # API Keys

  /v1/projects/{project_id}/api-keys:
    parameters:
      - $ref: "#/components/parameters/ProjectId"

    post:
      tags: [API Keys]
      summary: Create an API key
      operationId: postv1projectsprojectidapikeys
      description: |
        The raw key value (`tb_xxxxx`) is returned once in this response and never again.
        Tiber stores only a SHA-256 hash.
        Store the key securely immediately after creation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAPIKeyRequest"
      responses:
        "201":
          description: API key created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyWithSecret"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

    get:
      tags: [API Keys]
      summary: List API keys
      operationId: getv1projectsprojectidapikeys
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: List of API keys
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyList"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/projects/{project_id}/api-keys/{key_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/KeyId"

    get:
      tags: [API Keys]
      summary: Get an API key
      operationId: getv1projectsprojectidapikeyskeyid
      responses:
        "200":
          description: API key found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKey"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [API Keys]
      summary: Revoke an API key
      operationId: deletev1projectsprojectidapikeyskeyid
      description: >
        Revokes the API key immediately. Once revoked, the key can no
        longer be used to authenticate requests and cannot be reactivated.
      responses:
        "204":
          description: API key revoked
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # Templates

  /v1/projects/{project_id}/template-presets:
    parameters:
      - $ref: "#/components/parameters/ProjectId"

    get:
      tags: [Templates]
      summary: List template presets
      operationId: getv1projectsprojectidtemplatepresets
      description: >
        Returns the built-in starter templates. A preset is not persisted: pass
        its `id` as `preset_id` when creating a template.
      responses:
        "200":
          description: Available presets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TemplatePreset"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/projects/{project_id}/templates:
    parameters:
      - $ref: "#/components/parameters/ProjectId"

    post:
      tags: [Templates]
      summary: Create a template
      operationId: postv1projectsprojectidtemplates
      description: >
        Creates a reusable notification template holding one variant per
        delivery channel. Supply `variants` directly, or `preset_id` to start
        from a starter returned by GET /template-presets. Content is Liquid
        source: `{{ variable }}` output is rendered at send time, and nothing is
        escaped automatically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTemplateRequest"
      responses:
        "201":
          description: Template created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

    get:
      tags: [Templates]
      summary: List templates
      operationId: getv1projectsprojectidtemplates
      description: Returns templates belonging to the project.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: channel
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Channel"
      responses:
        "200":
          description: List of templates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateList"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/projects/{project_id}/templates/{template_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/TemplateId"

    get:
      tags: [Templates]
      summary: Get a template
      operationId: getv1projectsprojectidtemplatestemplateid
      responses:
        "200":
          description: Template found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags: [Templates]
      summary: Replace a template
      operationId: putv1projectsprojectidtemplatestemplateid
      description: >
        Replaces the whole template: `name` and the full `variants` list are
        required. The slug is re-derived from the new name, so a rename can
        change `template_slug`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTemplateRequest"
      responses:
        "200":
          description: Template updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

    delete:
      tags: [Templates]
      summary: Delete a Template
      operationId: deletev1projectsprojectidtemplatestemplateid
      description: |
        Permanently deletes the template.

        Notifications already dispatched are unaffected, but delivery re-resolves
        the template before sending, so deleting a template (or removing a
        channel variant) can fail notifications that were accepted and are still
        pending.
      responses:
        "204":
          description: Template deleted.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/projects/{project_id}/templates/preview:
    parameters:
      - $ref: "#/components/parameters/ProjectId"

    post:
      tags: [Templates]
      summary: Preview unsaved content
      operationId: postv1projectsprojectidtemplatespreview
      description: |
        Renders editor content through the same Liquid engine used for delivery,
        without persisting a template. This is the draft counterpart to
        `POST /templates/{template_id}/preview`.

        The response matches the shape the send path persists for the channel:
        channels that do not support a subject return `title: null`.

        The returned HTML is authored content and is not sanitized server-side:
        clients must render it in a sandboxed frame.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateContentPreviewRequest"
      responses:
        "200":
          description: Rendered draft content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplatePreviewResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /v1/projects/{project_id}/templates/{template_id}/preview:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/TemplateId"

    post:
      tags: [Templates]
      summary: Preview a template
      operationId: postv1projectsprojectidtemplatestemplateidpreview
      description: |
        Renders the template's variant for the requested channel with supplied
        variables, using the same Liquid engine as delivery. Nothing is persisted.

        The response matches the shape the send path persists for the channel:
        channels that do not support a subject return `title: null`.

        The returned HTML is authored content and is not sanitized server-side:
        clients must render it in a sandboxed frame.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplatePreviewRequest"
      responses:
        "200":
          description: Rendered template content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplatePreviewResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  # Recipients

  /v1/projects/{project_id}/recipients:
    parameters:
      - $ref: "#/components/parameters/ProjectId"

    post:
      tags: [Recipients]
      summary: Create a recipient
      operationId: postv1projectsprojectidrecipients
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRecipientRequest"
      responses:
        "201":
          description: Recipient created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipient"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

    get:
      tags: [Recipients]
      summary: List recipients
      operationId: getv1projectsprojectidrecipients
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: recipient
          in: query
          required: false
          description: >
            Narrow the page to one exact external identifier.
          schema:
            type: string
            maxLength: 255
      responses:
        "200":
          description: List of recipients
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipientList"
        "403":
          $ref: "#/components/responses/Forbidden"

    patch:
      tags: [Recipients]
      summary: Update a recipient
      operationId: patchv1projectsprojectidrecipients
      description: |
        Replaces the recipient's whole address book, addressed by the
        `recipient` query parameter (an external id). An omitted channel is
        removed; the request cannot leave an opted-out channel without an
        address. The optional `timezone` follows partial semantics: omitting it
        keeps the stored value, `null` records the fact as unknown.
      parameters:
        - $ref: "#/components/parameters/RecipientExternalId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRecipientRequest"
      responses:
        "200":
          description: Recipient updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipient"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

    delete:
      tags: [Recipients]
      summary: Delete a recipient
      operationId: deletev1projectsprojectidrecipients
      description: |
        Deletes the recipient named by the `recipient` query parameter (an
        external id).

        Deletion takes effect immediately: the recipient stops resolving for
        new requests, and its personal data - external id, addresses, profile
        facts - is scrubbed in the same transaction. Delivery history is retained,
        because notifications, engagement events and intake records reference
        the recipient record.

        Irreversible: the scrubbed identity cannot be recovered. Deleting an
        already-deleted recipient returns `404`.
      parameters:
        - $ref: "#/components/parameters/RecipientExternalId"
      responses:
        "204":
          description: Recipient deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/projects/{project_id}/recipients/preferences:
    parameters:
      - $ref: "#/components/parameters/ProjectId"

    put:
      tags: [Recipients]
      summary: Update a recipient's delivery preferences
      operationId: putv1projectsprojectidrecipientspreferences
      description: >
        Applies opt-outs, unsubscribes, and time restrictions for the recipient
        named by the `recipient` query parameter (an external id). Partial
        semantics: an omitted consent list keeps its stored value, while an
        explicit empty list clears it. For `blackout_period` and `quiet_hours`,
        omission keeps the stored value, `null` clears it, and an object
        replaces it. Repeating an identical request is therefore idempotent.
      parameters:
        - name: recipient
          in: query
          required: true
          description: The recipient's external id.
          schema:
            type: string
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipientPreferencesRequest"
      responses:
        "200":
          description: Consent state updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipient"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /v1/projects/{project_id}/delivery-constraint:
    parameters:
      - $ref: "#/components/parameters/ProjectId"

    get:
      tags: [Delivery Constraints]
      summary: Read the project's delivery constraint
      operationId: getv1projectsprojectiddeliveryconstraint
      description: >
        Returns the singleton delivery constraint for the project. An
        unconfigured project reads as UTC with no blackout periods and no
        quiet-hours windows; reading never creates the row.
      responses:
        "200":
          description: Current delivery constraint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryConstraint"
        "403":
          $ref: "#/components/responses/Forbidden"

    put:
      tags: [Delivery Constraints]
      summary: Replace the project's delivery constraint
      operationId: putv1projectsprojectiddeliveryconstraint
      description: |
        Replaces the whole singleton configuration: an omitted list clears it.
        Blackout periods are absolute, inclusive datetime ranges and suppress
        matching sends. Quiet-hours windows are recurring wall-clock ranges in
        `timezone` and postpone matching sends until the next window end plus a
        five-minute grace period.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryConstraintUpdateRequest"
      responses:
        "200":
          description: Delivery constraint replaced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryConstraint"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /v1/projects/{project_id}/topics:
    parameters:
      - $ref: "#/components/parameters/ProjectId"

    post:
      tags: [Topics]
      summary: Create a topic
      operationId: postv1projectsprojectidtopics
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationTopicCreateRequest"
      responses:
        "201":
          description: Topic created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationTopic"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

    get:
      tags: [Topics]
      summary: List topics
      operationId: getv1projectsprojectidtopics
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: List of topics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationTopicList"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/projects/{project_id}/topics/{topic_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: topic_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/UUID"

    get:
      tags: [Topics]
      summary: Get a topic
      operationId: getv1projectsprojectidtopicstopicid
      responses:
        "200":
          description: Topic found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationTopic"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags: [Topics]
      summary: Update a topic
      operationId: patchv1projectsprojectidtopicstopicid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationTopicUpdateRequest"
      responses:
        "200":
          description: Topic updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationTopic"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

    delete:
      tags: [Topics]
      summary: Delete a topic
      operationId: deletev1projectsprojectidtopicstopicid
      responses:
        "204":
          description: Topic deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # Notifications

  /v1/projects/{project_id}/notifications:
    parameters:
      - $ref: "#/components/parameters/ProjectId"

    post:
      tags: [Notifications]
      summary: Send a notification
      operationId: postv1projectsprojectidnotifications
      description: |
        Accepts a notification request, checks the idempotency key, resolves the
        recipient and template, plans the channels, and enqueues the work. The
        request is expanded asynchronously, so this returns immediately.

        Supply `Idempotency-Key` to make client retries safe. Replaying a key
        with the same payload returns the original transaction; the same key
        with a different payload is a conflict.

        Follow processing with GET /notification-requests/{transaction_id}.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 255
          description: Client-generated key for safe retries.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNotificationRequest"
      responses:
        "202":
          description: Request accepted for asynchronous processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationCreateResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"

    get:
      tags: [Notifications]
      summary: List notifications
      operationId: getv1projectsprojectidnotifications
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: recipient
          in: query
          required: false
          description: Narrow to one recipient by external id.
          schema:
            type: string
            maxLength: 255
        - name: channel
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Channel"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/NotificationStatus"
      responses:
        "200":
          description: List of notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationList"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/projects/{project_id}/notifications/{notification_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/NotificationId"

    get:
      tags: [Notifications]
      summary: Get a notification
      operationId: getv1projectsprojectidnotificationsnotificationid
      responses:
        "200":
          description: Notification found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/projects/{project_id}/notifications/{notification_id}/cancellation:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/NotificationId"

    put:
      tags: [Notifications]
      summary: Cancel a notification
      operationId: putv1projectsprojectidnotificationsnotificationidcancellation
      description: |
        Cancels a notification that has not yet been dispatched to a provider.

        Only notifications in a cancellable state (`pending`) may be cancelled.

        Notifications that are already processing, delivered,
        failed, or previously cancelled cannot be cancelled.

      responses:
        "204":
          description: Notification cancelled
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            The notification cannot be cancelled because it is no longer
            in a cancellable state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # Delivery Attempts

  /v1/projects/{project_id}/notifications/{notification_id}/delivery-attempts:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/NotificationId"

    get:
      tags: [Delivery Attempts]
      summary: List delivery attempts
      operationId: getv1projectsprojectidnotificationsnotificationiddeliveryattempts
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      description: |
        Returns all delivery attempts for a notification in chronological order.
        Each attempt records the provider response, outcome, and any policy
        violation reason. This is the primary diagnostic surface for failed
        or delayed notifications.
      responses:
        "200":
          description: List of delivery attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryAttemptList"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/projects/{project_id}/notifications/{notification_id}/delivery-attempts/{attempt_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/NotificationId"
      - $ref: "#/components/parameters/AttemptId"

    get:
      tags: [Delivery Attempts]
      summary: Get a delivery attempt
      operationId: getv1projectsprojectidnotificationsnotificationiddeliveryattemptsattemptid
      responses:
        "200":
          description: Delivery attempt found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryAttempt"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/projects/{project_id}/notification-requests/{transaction_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"

    get:
      tags: [Notifications]
      summary: Get a notification request
      operationId: getv1projectsprojectidnotificationrequeststransactionid
      description: |
        Status of an accepted request and the notifications it produced.

        `status` is `received` or `processing` while the request is being
        expanded (with `notifications` empty), `completed` once every planned
        channel has its notification, and `failed` if processing could not
        finish — in which case `failure_reason` is set.
      parameters:
        - name: transaction_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
      responses:
        "200":
          description: Request status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationRequestStatus"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # Webhooks

  /v1/projects/{project_id}/webhooks:
    parameters:
      - $ref: "#/components/parameters/ProjectId"

    post:
      tags: [Webhooks]
      summary: Register a webhook endpoint
      operationId: postv1projectsprojectidwebhooks
      description: |
        Registers an outbound callback URL that Tiber will call when
        subscribed notification lifecycle events occur. The Worker Service
        Webhook Dispatcher fires the callbacks — the API Service owns
        registration only.

        The URL must use HTTPS on port 443 and resolve only to public internet
        addresses. Localhost, private, link-local, and cloud metadata
        destinations are rejected at registration and again at dispatch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWebhookRequest"
      responses:
        "201":
          description: Webhook endpoint registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateWebhookResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

    get:
      tags: [Webhooks]
      summary: List webhook endpoints
      operationId: getv1projectsprojectidwebhooks
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: List of webhook endpoints
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpointList"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/projects/{project_id}/webhooks/{webhook_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/WebhookId"

    get:
      tags: [Webhooks]
      summary: Get a webhook endpoint
      operationId: getv1projectsprojectidwebhookswebhookid
      responses:
        "200":
          description: Webhook endpoint found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpoint"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags: [Webhooks]
      summary: Update a webhook endpoint
      operationId: patchv1projectsprojectidwebhookswebhookid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWebhookRequest"
      responses:
        "200":
          description: Webhook endpoint updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpoint"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

    delete:
      tags: [Webhooks]
      summary: Delete a webhook endpoint
      operationId: deletev1projectsprojectidwebhookswebhookid
      responses:
        "204":
          description: Webhook endpoint deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # Engagement Events

  /v1/projects/{project_id}/engagement-events:
    parameters:
      - $ref: "#/components/parameters/ProjectId"

    get:
      tags: [Engagement Events]
      operationId: listProjectEngagementEvents
      summary: List engagement events
      description: |
        Returns engagement events recorded across all notifications within
        the project. This endpoint is intended for analytics, reporting,
        and auditing engagement activity.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: event_type
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/EngagementEventType"
        - $ref: "#/components/parameters/RecipientIdQuery"
        - $ref: "#/components/parameters/NotificationIdQuery"
        - name: channel
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Channel"
        - name: occurred_after
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Timestamp"
        - name: occurred_before
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Timestamp"
      responses:
        "200":
          description: Paginated list of engagement events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngagementEventList"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/projects/{project_id}/engagement-events/{event_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/EngagementEventId"

    get:
      tags: [Engagement Events]
      operationId: getEngagementEvent
      summary: Get an engagement event
      description: |
        Returns a single engagement event recorded for the project.
      responses:
        "200":
          description: Engagement event found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngagementEvent"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/projects/{project_id}/notifications/{notification_id}/engagement-events:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/NotificationId"

    get:
      tags: [Engagement Events]
      summary: List engagement events for a notification
      operationId: getv1projectsprojectidnotificationsnotificationidengagementevents
      description: |
        Returns all engagement events recorded for a specific notification.
        Events are reported by the delivery provider and recorded by Tiber
        after the notification has been delivered.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: event_type
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/EngagementEventType"
      responses:
        "200":
          description: Paginated list of engagement events for this notification.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngagementEventList"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      tags: [Engagement Events]
      summary: Report a client-observed engagement event
      operationId: reportNotificationEngagementEvent
      description: |
        Records a push or in-app interaction observed by the client
        application. Email and SMS engagement is reported by the delivery
        provider and is rejected here with `422`.

        Requires an `Idempotency-Key` header. Repeating the request with the
        same key and payload returns the original event with `200` and
        `Idempotent-Replayed: true`; reusing the key with a different payload
        is rejected with `409`. The key is scoped to the project.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Client-generated key identifying this one report.
          schema:
            type: string
            minLength: 1
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EngagementEventReportRequest"
      responses:
        "201":
          description: Event recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngagementEvent"
        "200":
          description: Replay of an already-recorded event.
          headers:
            Idempotent-Replayed:
              description: Present and true when the event was replayed.
              schema:
                type: string
                enum: ["true"]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngagementEvent"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  # Observability

  /health:
    get:
      tags: [Observability]
      summary: Service health check
      operationId: gethealth
      security: []
      description: |
        Checks live connectivity for Postgres, Redis, and RabbitMQ.
        Redis failure is reported as `unhealthy` (not degraded) because
        authentication fails closed when Redis is unreachable, the
        service is effectively down for authenticated requests.
      responses:
        "200":
          description: All dependencies healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: One or more dependencies unhealthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

# Components

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: |
        `Authorization: Bearer <token>` scheme supports two authentication mechanisms:
        - **API Keys** (`tb_xxxxx`) for client applications
        - **JWT access tokens** for dashboard users

  # Parameters

  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"

    AttemptId:
      name: attempt_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"

    EngagementEventId:
      name: event_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"

    KeyId:
      name: key_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"

    TemplateId:
      name: template_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"

    RecipientExternalId:
      name: recipient
      in: query
      required: true
      description: The recipient's external id.
      schema:
        type: string
        maxLength: 255

    NotificationId:
      name: notification_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"

    WebhookId:
      name: webhook_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"

    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50

    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor returned as `next_cursor` by the previous page.
      schema:
        type: string
        maxLength: 512

    RecipientIdQuery:
      name: recipient_id
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/UUID"

    NotificationIdQuery:
      name: notification_id
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/UUID"

  # Reusable responses

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: not_found
            message: Notification abc123 not found
            status: 404
            correlation_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6

    Unauthorized:
      description: Authentication failed or token revoked
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: unauthorized
            message: Invalid or expired token
            status: 401
            correlation_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6

    Conflict:
      description: Resource already exists
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: conflict
            message: A project with this slug already exists
            status: 409
            correlation_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6

    UnprocessableEntity:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"
          example:
            error: validation_error
            message: Request validation failed
            status: 422
            correlation_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
            details:
              - field: channel
                message: "Input should be 'email', 'push', 'sms' or 'in_app'"

    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: rate_limit_exceeded
            message: Too many requests. Retry after 60 seconds.
            status: 429
            correlation_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6

    Forbidden:
      description: Access denied
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: permission_denied
            message: You do not have permission to access this resource
            status: 403
            correlation_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6

    BadRequest:
      description: |
        The request is valid but cannot be processed in its current state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: no_password_set
            message: This account was created via GitHub OAuth and has no password
            status: 400
            correlation_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6

  # Schemas

  schemas:
    # Shared

    Timestamp:
      type: string
      format: date-time

    UUID:
      type: string
      format: uuid

    ErrorResponse:
      type: object
      required: [error, message, status, correlation_id]
      properties:
        error:
          type: string
          example: not_found
        message:
          type: string
          example: Notification abc123 not found
        status:
          type: integer
          example: 404
        correlation_id:
          $ref: "#/components/schemas/UUID"
          description: Correlation identifier that can be supplied to support teams for debugging.

    ValidationErrorResponse:
      type: object
      required: [error, message, status, details, correlation_id]
      properties:
        error:
          type: string
          example: validation_error
        message:
          type: string
          example: Request validation failed
        status:
          type: integer
          example: 422
        details:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
                example: channel
              message:
                type: string
                example: "Input should be 'email', 'push', 'sms' or 'in_app'"
        correlation_id:
          $ref: "#/components/schemas/UUID"
          description: Correlation identifier that can be supplied to support teams for debugging.

    Channel:
      type: string
      enum: [email, push, sms, in_app]

    NotificationStatus:
      type: string
      description: |
        The current lifecycle state of the notification.

        - `pending` — Accepted by the API, passed validation, persisted, and awaiting delivery.
        - `processing` — Currently being delivered by a worker.
        - `delivered` — Successfully dispatched to the provider.
        - `failed` — Delivery failed after all retry attempts were exhausted.
        - `bounced` — The recipient's side rejected the message after it was dispatched.
        - `postponed` — Deferred by a quiet-hours policy; delivery is re-queued for the resume time (`scheduled_at`).
        - `suppressed` — Intentionally not delivered because a delivery policy was violated (opt-out, blackout, or missing address); the reason is permanent.
        - `cancelled` — Cancelled before processing began.
      enum:
        - pending
        - processing
        - postponed
        - cancelled
        - delivered
        - failed
        - bounced
        - suppressed

    DeliveryAttemptStatus:
      type: string
      enum: [success, fail]

    AccountRole:
      type: string
      enum: [admin, user]

    # Auth

    Account:
      type: object
      required: [id, email, role, is_verified, pending_email, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/AccountRole"
        is_verified:
          type: boolean
          description: |
            Whether the account has confirmed its email address.
            Always True for accounts created via Github Oauth.
            Unverified accounts cannot access protected endpoints.
        pending_email:
          type: [string, "null"]
          format: email
          description: |
            A new email address awaiting verification.
            Set when the account submits a new email via PATCH /v1/auth/me.
            Becomes the active email once verified via POST /v1/auth/email/verify.
            Null if no email change is pending.
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    TokenResponse:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          example: bearer
        expires_in:
          type: integer
          description: Access token lifetime in seconds
          example: 900

    RegistrationAccepted:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: If the address can be registered, a verification email will arrive.

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
          description: Required for email/password registration.

    EmailVerifyRequest:
      type: object
      required: [email, otp]
      properties:
        email:
          type: string
          format: email
          description: The email address that received the verification code.
        otp:
          type: string
          pattern: "^[0-9]{6}$"
          description: The six-digit verification code received by email.

    EmailVerifyResendRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    UpdateMeRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    PasswordChangeRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
          minLength: 8

    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    PasswordResetConfirm:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          description: The reset token received via email.
        password:
          type: string
          format: password
          minLength: 8
          description: The new password.

    # Project

    Project:
      type: object
      required: [id, name, slug, deleted, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        name:
          type: string
          example: My Application
        slug:
          type: string
          example: my-application
          description: >
            Derived once from the name at creation and immutable
            thereafter. Clients never supply it.
        description:
          type: [string, "null"]
        deleted:
          type: boolean
          description: >
            Indicates whether the project is deleted. deleted projects
            remain accessible for historical data but cannot accept new
            notifications or other mutating operations.
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
        deleted_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"

    CreateProjectRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500

    UpdateProjectRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: [string, "null"]
          maxLength: 500

    ProjectList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        next_cursor:
          type: string
          nullable: true
          description: |
            Pass as `cursor` to fetch the next page; null on the last page.

    # API Key

    APIKey:
      type: object
      required: [id, project_id, name, prefix, created_at, revoked_at, expires_at]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        project_id:
          $ref: "#/components/schemas/UUID"
        name:
          type: string
          example: Production API Key
        prefix:
          type: string
          description: >
            Non-sensitive prefix of the API key used to identify
            the key in dashboards and audit logs.
          example: tb_abc123
        last_used_at:
          $ref: "#/components/schemas/Timestamp"
          nullable: true
        created_at:
          $ref: "#/components/schemas/Timestamp"
        revoked_at:
          $ref: "#/components/schemas/Timestamp"
          nullable: true
        expires_at:
          $ref: "#/components/schemas/Timestamp"
          nullable: true

    APIKeyWithSecret:
      allOf:
        - $ref: "#/components/schemas/APIKey"
        - type: object
          required: [key]
          properties:
            key:
              type: string
              description: Full API key value. Shown once, store it securely.
              example: tb_abc123def456ghi789jkl012mno345pqr678stu901vwx

    CreateAPIKeyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100

    APIKeyList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/APIKey"
        next_cursor:
          type: string
          nullable: true
          description: |
            Pass as `cursor` to fetch the next page; null on the last page.

    # Template

    Template:
      type: object
      required:
        [id, project_id, name, template_slug, variants, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        project_id:
          $ref: "#/components/schemas/UUID"
        name:
          type: string
        template_slug:
          type: string
          description: Project-unique slug re-derived from the name on rename.
        variants:
          type: array
          items:
            $ref: "#/components/schemas/TemplateVariant"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"

    TemplateVariantRequest:
      type: object
      required: [channel, content]
      properties:
        channel:
          $ref: "#/components/schemas/Channel"
        content:
          $ref: "#/components/schemas/NotificationContent"

    TemplateVariant:
      type: object
      required: [channel, content, required_variables]
      properties:
        channel:
          $ref: "#/components/schemas/Channel"
        content:
          $ref: "#/components/schemas/NotificationContent"
        required_variables:
          type: array
          items:
            type: string
          description: >
            Variables the variant's content references, sorted. Supply all of
            them as `template_variables` when sending.

    TemplatePreset:
      type: object
      required: [id, name, variant]
      properties:
        id:
          type: string
          example: email-starter
        name:
          type: string
        variant:
          $ref: "#/components/schemas/TemplateVariant"

    CreateTemplateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        variants:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/TemplateVariantRequest"
          description: One variant per channel. Mutually exclusive with `preset_id`.
        preset_id:
          type: [string, "null"]
          description: >
            Starter id from GET /template-presets. Mutually exclusive with
            `variants`.

    UpdateTemplateRequest:
      type: object
      required: [name, variants]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        variants:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/TemplateVariantRequest"

    TemplatePreviewRequest:
      type: object
      required: [channel]
      properties:
        channel:
          $ref: "#/components/schemas/Channel"
        variables:
          type: object
          additionalProperties: true
          description: Values for the template's required variables.

    TemplateContentPreviewRequest:
      type: object
      required: [channel, content]
      properties:
        channel:
          $ref: "#/components/schemas/Channel"
        content:
          $ref: "#/components/schemas/NotificationContent"
        variables:
          type: object
          additionalProperties: true
          description: Values for the variables the draft content references.

    TemplatePreviewResponse:
      type: object
      required: [channel, content, required_variables]
      properties:
        channel:
          $ref: "#/components/schemas/Channel"
        content:
          $ref: "#/components/schemas/NotificationContent"
        required_variables:
          type: array
          items:
            type: string
          description: Variables the rendered content requires, sorted.

    TemplateList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Template"
        next_cursor:
          type: string
          nullable: true
          description: |
            Pass as `cursor` to fetch the next page; null on the last page.

    # Recipient

    RecipientAddresses:
      type: object
      description: |
        Channel-specific addressing. At most one address per channel.

        The object may be empty for a recipient identified only by
        `external_id`; such a recipient can be targeted by id, but a request
        must still name the channels it wants.
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        push:
          type: string
          description: FCM push token.
        in_app:
          type: string
          description: Client-side in-app user identifier used as the feed destination.

    Recipient:
      type: object
      required:
        - id
        - project_id
        - addresses
        - timezone
        - opted_out_channels
        - unsubscribed_categories
        - unsubscribed_topics
        - blackout_period
        - quiet_hours
        - created_at
        - updated_at
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        project_id:
          $ref: "#/components/schemas/UUID"
        external_id:
          type: [string, "null"]
          description: Your system's stable identifier for this recipient.
        addresses:
          $ref: "#/components/schemas/RecipientAddresses"
        timezone:
          type: [string, "null"]
          maxLength: 64
          description: |
            The recipient's IANA timezone, such as `Europe/Lisbon`, or null
            when unknown. Quiet hours are projected onto this wall clock.
        opted_out_channels:
          type: array
          items:
            $ref: "#/components/schemas/Channel"
          uniqueItems: true
          description: |
            Channels this recipient has opted out of entirely. A notification
            on an opted-out channel is accepted and recorded as suppressed.
        unsubscribed_categories:
          type: array
          items:
            $ref: "#/components/schemas/NotificationCategory"
          uniqueItems: true
          description: |
            Categories this recipient has unsubscribed from. CRITICAL is never
            present: it is always deliverable.
        unsubscribed_topics:
          type: array
          items:
            $ref: "#/components/schemas/UUID"
          uniqueItems: true
          description: Topics this recipient has unsubscribed from.
        blackout_period:
          oneOf:
            - $ref: "#/components/schemas/BlackoutPeriod"
            - type: "null"
          description: >
            The recipient's personal absolute blackout, or null when none is
            configured. A send inside it is suppressed.
        quiet_hours:
          oneOf:
            - $ref: "#/components/schemas/QuietHours"
            - type: "null"
          description: >
            The recipient's personal recurring quiet-hours window, or null when
            none is configured. A send inside it is postponed. Evaluated on the
            recipient's profile timezone, falling back to UTC.
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"

    CreateRecipientRequest:
      type: object
      required: [external_id]
      properties:
        external_id:
          type: string
          minLength: 1
          maxLength: 255
          description: Your system's stable identifier for this recipient.
        addresses:
          $ref: "#/components/schemas/RecipientAddresses"
          description: >
            Optional. Omitting it registers the recipient by external id only;
            no channel can deliver until an address exists.
        timezone:
          type: [string, "null"]
          maxLength: 64
          description: >
            Optional IANA timezone of the person. Unknown is stored as null and
            evaluated as UTC; it is not guessed from an address.

    UpdateRecipientRequest:
      type: object
      required: [addresses]
      description: >
        The full replacement address book. Sending `{}` removes every address,
        which is only valid for a recipient that has an external id.

        `timezone` is partial: omitting it keeps the stored value, `null`
        records the fact as unknown.
      properties:
        addresses:
          $ref: "#/components/schemas/RecipientAddresses"
        timezone:
          type: [string, "null"]
          maxLength: 64
          description: |
            IANA timezone, such as `Europe/Lisbon`. Omit to keep the stored
            value; send null to mark it unknown.

    RecipientPreferencesRequest:
      type: object
      description: >
        Partial delivery preferences. An omitted consent list is left untouched;
        an explicit empty list clears it. CRITICAL cannot be unsubscribed from,
        and an opted-out channel must have a registered address. For
        `blackout_period` and `quiet_hours`, omission leaves the stored value
        untouched, `null` clears it, and an object replaces it.
      properties:
        opted_out_channels:
          type: array
          items:
            $ref: "#/components/schemas/Channel"
          uniqueItems: true
        unsubscribed_categories:
          type: array
          items:
            $ref: "#/components/schemas/NotificationCategory"
          uniqueItems: true
        unsubscribed_topics:
          type: array
          items:
            $ref: "#/components/schemas/UUID"
          uniqueItems: true
        blackout_period:
          oneOf:
            - $ref: "#/components/schemas/BlackoutPeriod"
            - type: "null"
          description: >
            Set to an object to replace the recipient's personal blackout, or
            to null to clear it. Omit the field to keep the stored blackout.
        quiet_hours:
          oneOf:
            - $ref: "#/components/schemas/QuietHours"
            - type: "null"
          description: >
            Set to an object to replace the recipient's personal quiet-hours
            window, or to null to clear it. Omit the field to keep the stored
            window.

    BlackoutPeriod:
      type: object
      required: [name, start, end]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Human-readable label for the period.
        start:
          $ref: "#/components/schemas/Timestamp"
        end:
          $ref: "#/components/schemas/Timestamp"
      description: |
        An absolute, inclusive datetime range. Both boundaries must be
        timezone-aware. A matching send is suppressed, never postponed.

    QuietHours:
      type: object
      required: [name, window_start, window_end, channel]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Human-readable label for the window.
        window_start:
          type: string
          format: time
          description: Local wall-clock time at which the restriction starts.
        window_end:
          type: string
          format: time
          description: |
            Local wall-clock time at which the restriction ends, inclusive: a
            send scheduled exactly at this time is still inside the window. A
            start later than the end spans midnight. The two boundaries must
            differ.
        channel:
          $ref: "#/components/schemas/Channel"
        description:
          type: [string, "null"]
          maxLength: 1000
          description: Optional human-readable note.
      description: |
        A recurring time-of-day restriction for one channel. Both boundaries
        are inclusive. A matching send is postponed to the next occurrence of
        `window_end` plus a five-minute grace period: the same day's occurrence
        when the send lands exactly on it, the next day's otherwise.

    DeliveryConstraint:
      type: object
      required: [timezone, blackout_periods, quiet_hours]
      properties:
        timezone:
          type: string
          description: IANA timezone used to project quiet-hours windows.
        blackout_periods:
          type: array
          items:
            $ref: "#/components/schemas/BlackoutPeriod"
        quiet_hours:
          type: array
          items:
            $ref: "#/components/schemas/QuietHours"

    DeliveryConstraintUpdateRequest:
      type: object
      required: [timezone]
      description: >
        Full replacement of the project's singleton delivery constraint. The
        timezone is required. Omitted lists are cleared.
      properties:
        timezone:
          type: string
          description: IANA timezone used to project quiet-hours windows.
        blackout_periods:
          type: array
          items:
            $ref: "#/components/schemas/BlackoutPeriod"
        quiet_hours:
          type: array
          items:
            $ref: "#/components/schemas/QuietHours"

    RecipientList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Recipient"
        next_cursor:
          type: string
          nullable: true
          description: |
            Pass as `cursor` to fetch the next page; null on the last page.

    # Notification

    ContentAction:
      type: object
      required: [label, url]
      properties:
        label:
          type: string
        url:
          type: string
          description: Target the action opens.

    ContentImage:
      type: object
      required: [url]
      properties:
        url:
          type: string
        alt:
          type: [string, "null"]

    NotificationContent:
      type: object
      description: >
        Semantic content. Both saved-template content and direct content are
        Liquid source, rendered with the request's variables at send time.
      properties:
        title:
          type: [string, "null"]
          maxLength: 255
          description: Title or subject; only channels that support one use it.
        plain_text_body:
          type: [string, "null"]
          description: Plain-text representation, for text-only channels.
        html_body:
          type: [string, "null"]
          maxLength: 1000000
          description: >
            Authored HTML, rendered as Liquid; only email and in-app accept it.
        actions:
          type: array
          items:
            $ref: "#/components/schemas/ContentAction"
        images:
          type: array
          items:
            $ref: "#/components/schemas/ContentImage"

    NotificationCategory:
      type: string
      enum: [critical, informational, social, promotional]

    SendTimeBasis:
      type: string
      enum: [immediate, explicit, ml_predicted]

    DecisionSummary:
      type: object
      required: [category, category_source, channel_source]
      description: The plan the intake processor settled on.
      properties:
        category:
          $ref: "#/components/schemas/NotificationCategory"
        category_source:
          type: string
          enum: [client, ml, default]
        topic_slug:
          type: [string, "null"]
        topic_source:
          type: [string, "null"]
          enum: [client, ml, default, null]
        channel_source:
          type: string
          enum: [client, addresses]
          description: >
            How the channel set was chosen: `client` listed `channels`, or
            `addresses` supplied the addresses, which are the set.
        model_version:
          type: [string, "null"]

    Notification:
      type: object
      required:
        [
          id,
          project_id,
          transaction_id,
          channel,
          category,
          content,
          status,
          send_time_basis,
          created_at,
          updated_at,
        ]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        project_id:
          $ref: "#/components/schemas/UUID"
        transaction_id:
          $ref: "#/components/schemas/UUID"
          description: The accepted request that produced this notification.
        recipient:
          type: [string, "null"]
          description: >
            The recipient's external id, when it has one. Null when the
            recipient was created by an address-based send, and also once the
            recipient has been deleted: the notification is still returned
            because it was still sent, but it no longer names anyone.
        channel:
          $ref: "#/components/schemas/Channel"
        address:
          type: [string, "null"]
          description: >
            Masked destination (for example `j***@example.com`). Returned only
            for address-based requests; registered-recipient sends omit it.
        category:
          $ref: "#/components/schemas/NotificationCategory"
        template_slug:
          type: [string, "null"]
          description: Set when the request used a saved template.
        topic_slug:
          type: [string, "null"]
        group_key:
          type: [string, "null"]
        content:
          $ref: "#/components/schemas/NotificationContent"
        status:
          $ref: "#/components/schemas/NotificationStatus"
        send_at:
          $ref: "#/components/schemas/Timestamp"
          nullable: true
        send_time_basis:
          $ref: "#/components/schemas/SendTimeBasis"
        delivered_at:
          $ref: "#/components/schemas/Timestamp"
          nullable: true
        suppression_reason:
          type: [string, "null"]
        cancellation_reason:
          type: [string, "null"]
        failure_reason:
          type: [string, "null"]
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"

    CreateNotificationRequest:
      type: object
      description: >
        One request targets one recipient, identified either by `recipient`
        (the client's external id, not the Tiber UUID) or by supplying channel
        addresses such as `email`. Supply either a saved template
        (`template_slug`) or direct `content`, not both.
      properties:
        recipient:
          type: [string, "null"]
          maxLength: 255
          description: >
            The recipient's external id, as registered by the client. Unknown
            ids are rejected with `404`.
        channels:
          type: [array, "null"]
          minItems: 1
          items:
            $ref: "#/components/schemas/Channel"
          description: >
            Channels to deliver on. Required with `recipient`: channel
            selection is explicit and never inferred. Every listed channel must
            have a registered destination (`in_app` needs an `in_app` address,
            like any other channel). `sms` is rejected until SMS delivery is
            enabled.
        email:
          type: [string, "null"]
          description: Supplying an address selects address-based delivery.
        push:
          type: [string, "null"]
        in_app:
          type: [string, "null"]
          description: Client-side in-app user identifier used as the feed destination.
        category:
          $ref: "#/components/schemas/NotificationCategory"
          nullable: true
        group_key:
          type: [string, "null"]
          maxLength: 255
        topic_slug:
          type: [string, "null"]
        template_slug:
          type: [string, "null"]
          description: Saved template to render. Mutually exclusive with `content`.
        template_variables:
          type: [object, "null"]
          additionalProperties: true
          description: >
            Values for the Liquid variables in the template, or in direct
            content when no template is used.
        content:
          $ref: "#/components/schemas/NotificationContent"
          nullable: true
          description: >
            Direct content, rendered as Liquid source with `template_variables`.
            Mutually exclusive with `template_slug`.
        send_at:
          $ref: "#/components/schemas/Timestamp"
          nullable: true
          description: >
            Explicit send time in UTC. Omit to send immediately or let planning
            choose the time.

    NotificationCreateResponse:
      type: object
      required: [project_id, transaction_id]
      properties:
        project_id:
          $ref: "#/components/schemas/UUID"
        transaction_id:
          $ref: "#/components/schemas/UUID"
          description: Use this to poll GET /notification-requests/{transaction_id}.

    NotificationRequestStatus:
      type: object
      required: [transaction_id, project_id, status]
      properties:
        transaction_id:
          $ref: "#/components/schemas/UUID"
        project_id:
          $ref: "#/components/schemas/UUID"
        status:
          type: string
          enum: [received, processing, completed, failed]
        failure_reason:
          type: [string, "null"]
          description: Set only when processing failed.
        decisions:
          $ref: "#/components/schemas/DecisionSummary"
          nullable: true
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
          description: Empty until processing completes.

    NotificationList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        next_cursor:
          type: string
          nullable: true
          description: |
            Pass as `cursor` to fetch the next page; null on the last page.

    # Notification Topic

    NotificationTopic:
      type: object
      required: [id, project_id, category, title, topic_slug, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        project_id:
          $ref: "#/components/schemas/UUID"
        category:
          $ref: "#/components/schemas/NotificationCategory"
        title:
          type: string
          maxLength: 200
        topic_slug:
          type: string
          maxLength: 100
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"

    NotificationTopicCreateRequest:
      type: object
      required: [title, category]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        category:
          $ref: "#/components/schemas/NotificationCategory"

    NotificationTopicUpdateRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        category:
          $ref: "#/components/schemas/NotificationCategory"

    NotificationTopicList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/NotificationTopic"
        next_cursor:
          type: string
          nullable: true
          description: |
            Pass as `cursor` to fetch the next page; null on the last page.

    # Delivery Attempt

    DeliveryAttempt:
      type: object
      required:
        [
          id,
          notification_id,
          attempt_number,
          status,
          channel,
          provider,
          created_at,
        ]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        notification_id:
          $ref: "#/components/schemas/UUID"
        attempt_number:
          type: integer
          minimum: 1
        status:
          $ref: "#/components/schemas/DeliveryAttemptStatus"
        channel:
          $ref: "#/components/schemas/Channel"
        provider:
          type: string
          example: resend
        provider_message_id:
          type: [string, "null"]
          description: |
            The provider's own reference ID for this message.
            Use this to cross-reference with provider logs or support.
            Null on failed attempts.
        recipient_address:
          type: [string, "null"]
          description: Address the attempt was made to, as resolved at dispatch.
        error:
          type: [string, "null"]
          description: Provider or policy failure reason; null on success.
        created_at:
          $ref: "#/components/schemas/Timestamp"

    DeliveryAttemptList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/DeliveryAttempt"
        next_cursor:
          type: string
          nullable: true
          description: |
            Pass as `cursor` to fetch the next page; null on the last page.

    # Engagement Event

    EngagementEventType:
      type: string
      enum:
        - open
        - click
        - bounce
        - complaint
        - unsubscribe

    EngagementEvent:
      type: object
      required:
        [
          id,
          project_id,
          notification_id,
          recipient_id,
          event_type,
          channel,
          provider,
          created_at,
          occurred_at,
        ]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        project_id:
          $ref: "#/components/schemas/UUID"
        notification_id:
          $ref: "#/components/schemas/UUID"
        recipient_id:
          $ref: "#/components/schemas/UUID"
          nullable: true
          description: >
            Null once the recipient has been erased. The event is still
            recorded; only its attribution to a person is gone.
        event_type:
          $ref: "#/components/schemas/EngagementEventType"
        channel:
          $ref: "#/components/schemas/Channel"
        provider:
          type: string
          description: The provider that reported this engagement event
        idempotency_key:
          type: string
          nullable: true
          description: |
            Client-supplied dedupe key; null for provider-reported events.
        is_synthetic:
          type: boolean
          description: True for events generated by the data simulator.
        metadata:
          type: object
          additionalProperties: true
          description: |
            Provider-specific event payload.
          example:
            ip_address: "192.168.1.5"
            user_agent: Mozilla/5.0
            link: "https://example.com/reset-password"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        occurred_at:
          $ref: "#/components/schemas/Timestamp"

    EngagementEventList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/EngagementEvent"
        next_cursor:
          type: string
          nullable: true
          description: |
            Pass as `cursor` to fetch the next page; null on the last page.

    EngagementEventReportRequest:
      type: object
      additionalProperties: false
      required: [event_type, occurred_at]
      properties:
        event_type:
          type: string
          enum: [open, click]
          description: |
            Only client-observable events. Provider-only `bounce`,
            `complaint`, and `unsubscribe` are rejected.
        occurred_at:
          $ref: "#/components/schemas/Timestamp"
        metadata:
          type: object
          additionalProperties: true
          description: Opaque client context, stored as JSON.

    # Webhook Endpoint

    WebhookEventType:
      type: string
      enum:
        - notification.delivered
        - notification.failed
        - notification.bounced
        - notification.suppressed
        - notification.cancelled

    WebhookEndpoint:
      type: object
      required:
        [
          id,
          project_id,
          url,
          events,
          secret_prefix,
          created_at,
          updated_at,
        ]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        project_id:
          $ref: "#/components/schemas/UUID"
        url:
          type: string
          format: uri
          description: Public HTTPS callback URL on port 443.
        events:
          type: array
          items:
            $ref: "#/components/schemas/WebhookEventType"
        secret_prefix:
          type: string
          description: Prefix of the webhook signing secret.
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"

    CreateWebhookRequest:
      type: object
      required: [url, events]
      properties:
        url:
          type: string
          format: uri
          description: >
            HTTPS URL on port 443 that resolves only to public internet
            addresses. Localhost, private, link-local, and metadata
            destinations are rejected.
        events:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/WebhookEventType"

    UpdateWebhookRequest:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: >
            Replacement HTTPS URL on port 443 that resolves only to public
            internet addresses.
        events:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/WebhookEventType"

    WebhookEndpointList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/WebhookEndpoint"
        next_cursor:
          type: string
          nullable: true
          description: |
            Pass as `cursor` to fetch the next page; null on the last page.

    CreateWebhookResponse:
      allOf:
        - $ref: "#/components/schemas/WebhookEndpoint"
        - type: object
          required: [signing_secret]
          properties:
            signing_secret:
              type: string
              description: >
                Shown only once. Store securely; it cannot be retrieved again.

    # Health

    DependencyCheck:
      type: string
      enum:
        - up
        - degraded
        - down

    HealthResponse:
      type: object
      required: [status, version, checks]
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
        version:
          type: string
          example: 0.1.0
        checks:
          type: object
          required: [postgres, redis, rabbitmq]
          properties:
            postgres:
              $ref: "#/components/schemas/DependencyCheck"
            redis:
              $ref: "#/components/schemas/DependencyCheck"
            rabbitmq:
              $ref: "#/components/schemas/DependencyCheck"
        timestamp:
          $ref: "#/components/schemas/Timestamp"
