<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Tiber domain model</title>
  <desc id="desc">Core Tiber entities and their relationships. External delivery services are represented by a string on DeliveryAttempt, not by a persisted entity.</desc>
  <style>
    text { font-family: sans-serif; fill: #28253d; }
    .entity { fill: #fff; stroke: #28253d; stroke-width: 2; }
    .line { stroke: #28253d; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .label { font-size: 14px; text-anchor: middle; }
    .name { font-size: 18px; font-weight: 700; text-anchor: middle; }
    .field { font-size: 13px; text-anchor: middle; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#28253d" />
    </marker>
  </defs>

  <rect width="1200" height="900" fill="#fff" />

  <g class="relationships">
    <path class="line" d="M 170 100 H 330" />
    <text class="label" x="250" y="90">owns</text>
    <path class="line" d="M 430 140 V 220" />
    <text class="label" x="455" y="185">contains</text>
    <path class="line" d="M 390 300 L 155 390" />
    <text class="label" x="250" y="335">owns</text>
    <path class="line" d="M 470 300 L 735 390" />
    <text class="label" x="615" y="335">owns</text>
    <path class="line" d="M 395 300 L 300 390" />
    <text class="label" x="345" y="350">manages</text>
    <path class="line" d="M 430 300 L 480 500" />
    <text class="label" x="455" y="410">creates</text>
    <path class="line" d="M 465 300 L 570 390" />
    <text class="label" x="535" y="350">configures</text>
    <path class="line" d="M 560 520 L 700 440" />
    <text class="label" x="635" y="485">optionally uses</text>
    <path class="line" d="M 480 580 L 430 680" />
    <text class="label" x="425" y="635">produces</text>
    <path class="line" d="M 525 580 L 620 680" />
    <text class="label" x="585" y="635">generates</text>
    <path class="line" d="M 400 760 L 250 830" />
    <path class="line" d="M 450 760 V 830" />
    <text class="label" x="320" y="805">sent via</text>
    <text class="label" x="475" y="805">delivered by</text>
  </g>

  <g class="entities">
    <g transform="translate(100 70)"><rect class="entity" width="140" height="60" rx="4"/><text class="name" x="70" y="37">User</text></g>
    <g transform="translate(330 50)"><rect class="entity" width="200" height="100" rx="4"/><text class="name" x="100" y="38">Workspace</text><text class="field" x="100" y="67">Future</text></g>
    <g transform="translate(350 220)"><rect class="entity" width="160" height="80" rx="4"/><text class="name" x="80" y="48">Project</text></g>
    <g transform="translate(80 390)"><rect class="entity" width="150" height="80" rx="4"/><text class="name" x="75" y="48">APIKey</text></g>
    <g transform="translate(260 390)"><rect class="entity" width="170" height="80" rx="4"/><text class="name" x="85" y="48">Recipient</text></g>
    <g transform="translate(700 390)"><rect class="entity" width="170" height="80" rx="4"/><text class="name" x="85" y="48">Template</text></g>
    <g transform="translate(490 390)"><rect class="entity" width="160" height="80" rx="4"/><text class="name" x="80" y="48">DeliveryConstraint</text></g>
    <g transform="translate(680 540)"><rect class="entity" width="180" height="80" rx="4"/><text class="name" x="90" y="48">WebhookEndpoint</text></g>
    <g transform="translate(400 500)"><rect class="entity" width="160" height="80" rx="4"/><text class="name" x="80" y="48">Notification</text></g>
    <g transform="translate(330 680)"><rect class="entity" width="200" height="80" rx="4"/><text class="name" x="100" y="35">DeliveryAttempt</text><text class="field" x="100" y="59">service_name: string</text></g>
    <g transform="translate(540 680)"><rect class="entity" width="200" height="80" rx="4"/><text class="name" x="100" y="48">EngagementEvent</text></g>
    <g transform="translate(150 830)"><rect class="entity" width="190" height="50" rx="4"/><text class="name" x="95" y="32">DeliveryChannel</text></g>
    <g transform="translate(380 830)"><rect class="entity" width="150" height="50" rx="4"/><text class="name" x="75" y="25">provider</text><text class="field" x="75" y="42">&lt;&lt;value_object&gt;&gt;</text></g>
  </g>
</svg>
